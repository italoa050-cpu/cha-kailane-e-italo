<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Presenças - Chá de Panela</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #4a4a4a;
        }
        .resumo {
            background-color: #eef7ee;
            border-left: 5px solid #2ecc71;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f8f8;
            color: #555;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        @media (max-width: 600px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                border: 1px solid #ccc;
                margin-bottom: 10px;
                border-radius: 8px;
                padding: 10px;
                background: #fff;
            }
            td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
            }
            td:before {
                position: absolute;
                top: 12px;
                left: 10px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                font-weight: bold;
                text-align: left;
            }
            td:nth-of-type(1):before { content: "ID"; }
            td:nth-of-type(2):before { content: "Nome"; }
            td:nth-of-type(3):before { content: "WhatsApp"; }
            td:nth-of-type(4):before { content: "Acompanhantes"; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Lista de Presenças Confirmadas</h1>
        
        <div class="resumo">
            👥 Total estimado de pessoas confirmadas: {{ total_pessoas }}
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>WhatsApp</th>
                    <th>Acompanhantes</th>
                </tr>
            </thead>
            <tbody>
                {% for p in presencas %}
                <tr>
                    <td>{{ p[0] }}</td>
                    <td><strong>{{ p[1] }}</strong></td>
                    <td>
                        <a href="https://wa.me/55{{ p[2] }}" target="_blank" style="color: #25D366; text-decoration: none; font-weight: bold;">
                            {{ p[2] }} 💬
                        </a>
                    </td>
                    <td>{{ p[3] if p[3] else 0 }} pessoa(s)</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" style="text-align: center;">Nenhuma presença confirmada ainda.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
